# Render Blueprint — https://render.com/docs/blueprint-spec
# Auto-deploys on every push to `main` once this repo is connected as a Blueprint.
# Secret values are NOT stored here (sync: false) — set them in the Render dashboard.
services:
  - type: web
    name: tratech-examsim
    runtime: node
    plan: free            # free tier sleeps after ~15 min idle; bump to "starter" (~$7/mo) to keep it warm
    region: oregon        # change to frankfurt/singapore/etc. if closer to your users
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        sync: false
      - key: OPENROUTER_MAX_TOKENS
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      # Public base URL of this web service — used in reminder deep links
      # (e.g. https://tratech-examsim.onrender.com). Required for scheduled
      # practice reminders.
      - key: APP_URL
        sync: false
      # Shared secret the external cron (cron-job.org) sends as the
      # `x-cron-secret` header to POST /api/internal/run-due-reminders.
      # Set the SAME value here and in the cron-job.org job. Required for
      # reminders to fire.
      - key: CRON_SECRET
        sync: false
      # Reminder email via Gmail SMTP — OPTIONAL. Without these the in-app
      # notification bell still works; set them to also send reminder emails.
      # GMAIL_USER = the dedicated sending Gmail address; GMAIL_APP_PASSWORD =
      # a Google "App Password" (16 chars) for that account. EMAIL_FROM is an
      # optional display form, e.g. "Tratech ExamSim <tratechexamsim@gmail.com>".
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
